<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lumen — Health</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumen">
<meta name="theme-color" content="#0B1310">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="white" stroke-width="2.4"/></svg>
      </div>
      <div class="brand-name">Lumen</div>
    </div>
    <div class="header-right">
      <div class="date-pill" id="dateStr">—</div>
      <div class="icon-btn" id="profileBtnHeader" data-tab="profile" title="Profile" aria-label="Profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
        </svg>
      </div>
      <div class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 005 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </div>
    </div>
  </header>

  <!-- ================= TODAY ================= -->
  <div class="page active" id="page-today">
    <div class="page-heading">Today</div>
  </div>

  <!-- ================= PROFILE ================= -->
  <div class="page" id="page-profile">
    <div class="page-heading">Profile</div>
  </div>

  <!-- ================= MOVE ================= -->
  <div class="page" id="page-move">
    <div class="page-eyebrow">Activity</div>
    <div class="page-heading">Move</div>
  </div>

  <!-- ================= GYM ================= -->
  <div class="page" id="page-gym">
    <div class="page-eyebrow">Strength</div>
    <div class="page-heading">Gym</div>
  </div>

  <!-- ================= HEART ================= -->
  <div class="page" id="page-heart">
    <div class="page-eyebrow">Lumen</div>
    <div class="page-heading">Heart</div>
  </div>

  <!-- ================= SLEEP ================= -->
  <div class="page" id="page-sleep">
    <div class="page-eyebrow">Rest</div>
    <div class="page-heading">Sleep</div>
  </div>

  <!-- ================= BODY ================= -->
  <div class="page" id="page-body">
    <div class="page-eyebrow">Body</div>
    <div class="page-heading">Water &amp; weight</div>
  </div>

  <!-- ================= MORE ================= -->
  <div class="page" id="page-more">
    <div class="page-eyebrow">Wellbeing</div>
    <div class="page-heading">More</div>
  </div>

</div>

<nav class="tabbar">
  <button class="tab-btn active" data-tab="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    Today
  </button>
  <button class="tab-btn" data-tab="move">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
    Move
  </button>
  <button class="tab-btn" data-tab="gym">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M18 7v10M2 10v4M22 10v4M6 12h12"/></svg>
    Gym
  </button>
  <button class="tab-btn" data-tab="heart">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.9-10.1-9.6C.3 8.2 1.7 4.8 5 3.9c2-.5 4 .3 5 2 1-1.7 3-2.5 5-2 3.3.9 4.7 4.3 3.1 7.5C19.5 16.1 12 21 12 21z"/></svg>
    Heart
  </button>
  <button class="tab-btn" data-tab="sleep">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 019.5 3.5a8.5 8.5 0 1011 11z"/></svg>
    Sleep
  </button>
  <button class="tab-btn" data-tab="body">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5s6.5 7.2 6.5 12a6.5 6.5 0 01-13 0c0-4.8 6.5-12 6.5-12z"/></svg>
    Body
  </button>
  <button class="tab-btn" data-tab="more">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/></svg>
    More
  </button>
</nav>

<script src="script.js"></script>

</body>
</html>
